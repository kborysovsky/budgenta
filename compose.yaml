services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pocket
      POSTGRES_USER: pocket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket -d pocket"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pocket:${POSTGRES_PASSWORD}@db:5432/pocket
    depends_on:
      db:
        condition: service_healthy
  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    profiles: ["telegram"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pocket:${POSTGRES_PASSWORD}@db:5432/pocket
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
volumes:
  postgres_data:
