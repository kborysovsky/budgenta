# Install inside nginx's http context, e.g. /etc/nginx/conf.d/budgenta.conf.
# Replace budget.example.com; use Certbot to add HTTPS and redirect HTTP.
map $uri $budgenta_login_key {
    default "";
    /api/auth/bot/start $binary_remote_addr;
    /api/auth/telegram $binary_remote_addr;
}
limit_req_zone $budgenta_login_key zone=budgenta_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=budgenta_requests:10m rate=10r/s;

server {
    listen 80;
    server_name budget.example.com;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    server_tokens off;
    limit_req_status 429;

    location / {
        limit_req zone=budgenta_login burst=5 nodelay;
        limit_req zone=budgenta_requests burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite untrusted forwarding headers instead of appending them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }
}
